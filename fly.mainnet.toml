# Nimbles on Nimiq MAINNET (real NIM). Separate app and separate volume from the testnet build in fly.toml,
# so no testnet balance, jar, pool or tx hash can ever be read as mainnet money.
# Deploy: fly deploy -c fly.mainnet.toml     (steps in MAINNET.md)
# The escrow key is NEVER in this file. It is the platform secret ESCROW_PRIVATE_KEY.
app = "nimbles-mainnet"
primary_region = "ams"

[build]

[env]
  CHAIN = "nimiq"
  NETWORK = "mainnet"
  ALLOW_MAINNET = "yes"
  # the public escrow address the key must derive to. A wrong key refuses to start
  EXPECTED_ESCROW_ADDRESS = "NQ87 51PJ 4Q0P RRQV DVCY L28T N3FK YUK6 P8DR"
  PORT = "8080"
  DATA_DIR = "/data"
  # launch cap: the biggest stake chip is 10 NIM. Raise on purpose, after the first real matches
  MAX_STAKE_NIM = "10"
  MIN_CONFIRMATIONS = "2"
  # Nimbles Showdown: a SEPARATE campaign wallet pays rewards, never the game escrow. Its key is the platform secret
  # CAMPAIGN_PRIVATE_KEY, never in this file. Without it the server runs and rewards wait in the queue.
  EXPECTED_CAMPAIGN_ADDRESS = "NQ79 HN52 XV6A 22L6 7ALU F14P L0BG 9YQP KMQ7"
  CAMPAIGN_START = "2026-11-09T00:00:00+01:00"
  CAMPAIGN_END = "2026-11-24T00:00:00+01:00"
  # set to "yes" to stop every campaign payout at once (the admin page has the same switch)
  CAMPAIGN_PAUSED = "no"

[[mounts]]
  source = "nimbles_mainnet_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
