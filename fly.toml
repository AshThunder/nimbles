app = "nimbles-nimiq"
primary_region = "ams"

[build]

[env]
  CHAIN = "nimiq"
  NETWORK = "testnet"
  PORT = "8080"
  DATA_DIR = "/data"
  MAX_STAKE_NIM = "100"

[[mounts]]
  source = "nimbles_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
